services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caravan}
      POSTGRES_USER: ${POSTGRES_USER:-caravan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caravan_secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caravan}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caravan}
      POSTGRES_USER: ${POSTGRES_USER:-caravan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caravan_secret}
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:-caravan-production-secret-key-change-me}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,nginx
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Караван <noreply@caravan.local>}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-True}
      NOTIFY_SMS: ${NOTIFY_SMS:-False}
      SMS_ENABLED: ${SMS_ENABLED:-False}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      SMS_API_URL: ${SMS_API_URL:-}
      SMS_API_TOKEN: ${SMS_API_TOKEN:-}
      SMS_SENDER: ${SMS_SENDER:-Caravan}
      CREATE_SUPERUSER: ${CREATE_SUPERUSER:-true}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@caravan.local}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin12345}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    volumes:
      - frontend_dist:/usr/share/nginx/html

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - static_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  media_data:
  static_data:
  frontend_dist:
